<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4d1c5">
<title>Living Reptile | Interactive Art</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d4d1c5;
}

body {
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#camera {
    display: none;
}

#controls {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 5;
}

#status {
    font: 10px monospace;
    letter-spacing: 2px;
    color: #77746a;
    white-space: nowrap;
}

#cameraButton {
    padding: 11px 17px;
    color: #e8e4d8;
    background: #171714;
    border: 1px solid #77746a;
    font: 10px monospace;
    letter-spacing: 1.5px;
    cursor: pointer;
}

#cameraButton:disabled {
    opacity: .55;
}

</style>
</head>

<body>

<canvas id="art"></canvas>

<div id="controls">
    <div id="status">MOVE YOUR CURSOR TO CONTROL THE REPTILE</div>
    <button id="cameraButton">ENABLE HAND CONTROL</button>
</div>

<video id="camera" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
"use strict";

/* ==========================================
   1. CANVAS
========================================== */

const canvas = document.getElementById("art");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const cameraButton = document.getElementById("cameraButton");
const video = document.getElementById("camera");

let W = innerWidth;
let H = innerHeight;
let DPR = 1;
let unit = 1;

function resize() {
    W = innerWidth;
    H = innerHeight;

    DPR = Math.min(devicePixelRatio || 1, 2);
    unit = Math.min(W / 900, H / 650);

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

addEventListener("resize", resize);
resize();


/* ==========================================
   2. CREATURE PHYSICS
========================================== */

const SEGMENTS = 34;
const SEGMENT_DISTANCE = 7.2;

const HEAD_STIFFNESS = 12;
const HEAD_DAMPING = 5.5;
const MAX_SPEED = 950;

const body = [];

let headX = W / 2;
let headY = H / 2;

let velocityX = 0;
let velocityY = 0;

let targetX = W / 2;
let targetY = H / 2;

let lastTime = performance.now();
let initialized = false;

function initializeBody() {
    body.length = 0;

    for (let i = 0; i < SEGMENTS; i++) {
        body.push({
            x: headX + i * SEGMENT_DISTANCE,
            y: headY,
            angle: 0
        });
    }

    initialized = true;
}

initializeBody();


/* ==========================================
   3. INPUT
========================================== */

function setTarget(x, y) {
    targetX = x;
    targetY = y;
}

canvas.addEventListener("pointermove", event => {
    if (event.pointerType === "mouse" ||
        event.pointerType === "touch") {
        setTarget(event.clientX, event.clientY);
    }
});

canvas.addEventListener("pointerdown", event => {
    setTarget(event.clientX, event.clientY);
});


/* ==========================================
   4. HEAD SPRING PHYSICS
========================================== */

function updateHead(dt) {
    const dx = targetX - headX;
    const dy = targetY - headY;

    let ax = dx * HEAD_STIFFNESS -
             velocityX * HEAD_DAMPING;

    let ay = dy * HEAD_STIFFNESS -
             velocityY * HEAD_DAMPING;

    velocityX += ax * dt;
    velocityY += ay * dt;

    const speed = Math.hypot(velocityX, velocityY);

    if (speed > MAX_SPEED) {
        velocityX = velocityX / speed * MAX_SPEED;
        velocityY = velocityY / speed * MAX_SPEED;
    }

    headX += velocityX * dt;
    headY += velocityY * dt;
}


/* ==========================================
   5. LINKED BODY FOLLOWING
========================================== */

function updateBody(dt) {

    body[0].x = headX;
    body[0].y = headY;

    const follow = 1 - Math.exp(-18 * dt);

    for (let i = 1; i < SEGMENTS; i++) {

        const previous = body[i - 1];
        const current = body[i];

        let dx = current.x - previous.x;
        let dy = current.y - previous.y;

        let distance = Math.hypot(dx, dy);

        if (distance < 0.0001) {
            dx = 1;
            dy = 0;
            distance = 1;
        }

        const desiredX =
            previous.x + dx / distance * SEGMENT_DISTANCE;

        const desiredY =
            previous.y + dy / distance * SEGMENT_DISTANCE;

        current.x += (desiredX - current.x) * follow;
        current.y += (desiredY - current.y) * follow;

        current.angle = Math.atan2(dy, dx);
    }

    body[0].angle = Math.atan2(
        headY - body[1].y,
        headX - body[1].x
    );
}


/* ==========================================
   6. BODY SHAPE
========================================== */

function drawBody() {

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /* Main body shadow */
    ctx.beginPath();

    body.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });

    ctx.strokeStyle = "rgba(78,76,68,0.45)";
    ctx.lineWidth = 29 * unit;
    ctx.stroke();

    /* Body base */
    ctx.beginPath();

    body.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });

    ctx.strokeStyle = "#aaa79b";
    ctx.lineWidth = 24 * unit;
    ctx.stroke();

    /* Light central surface */
    ctx.beginPath();

    body.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });

    ctx.strokeStyle = "rgba(222,219,207,.72)";
    ctx.lineWidth = 8 * unit;
    ctx.stroke();

    ctx.restore();
}


/* ==========================================
   7. INDIVIDUAL BODY SCALES
========================================== */

function drawScales(time) {

    for (let i = 1; i < SEGMENTS - 1; i++) {

        const p = body[i];
        const next = body[i + 1];

        const angle = Math.atan2(
            next.y - p.y,
            next.x - p.x
        );

        const size = (8.5 - i * .055) * unit;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);

        const gradient = ctx.createLinearGradient(
            0, -size, 0, size
        );

        gradient.addColorStop(0, "#66655d");
        gradient.addColorStop(.40, "#d0cdc1");
        gradient.addColorStop(.75, "#9c998d");
        gradient.addColorStop(1, "#5e5d56");

        ctx.beginPath();
        ctx.ellipse(
            0, 0,
            10 * unit,
            size,
            0, 0, Math.PI * 2
        );

        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-7 * unit, -size * .5);
        ctx.quadraticCurveTo(
            0, size * 1.1,
            7 * unit, -size * .5
        );

        ctx.strokeStyle = "rgba(78,77,70,.8)";
        ctx.lineWidth = 1 * unit;
        ctx.stroke();

        ctx.restore();
    }
}


/* ==========================================
   8. CURVED SPINES
========================================== */

function drawSpines(time) {

    /*
       Each spine is attached to a body segment.
       Both sides use the local body direction.
       This makes the entire fan rotate and bend
       with the creature instead of staying fixed.
    */

    for (let i = 4; i < 30; i++) {

        const p = body[i];
        const next = body[i + 1];

        const dx = next.x - p.x;
        const dy = next.y - p.y;

        const length = Math.hypot(dx, dy) || 1;

        const tx = dx / length;
        const ty = dy / length;

        const nx = -ty;
        const ny = tx;

        const progress = i / SEGMENTS;

        const spineLength =
            (48 + Math.sin(progress * Math.PI) * 105)
            * unit;

        const wave = Math.sin(
            time * .0015 + i * .35
        ) * 2 * unit;

        const start = {
            x: p.x,
            y: p.y
        };

        for (let side of [-1, 1]) {

            const L = spineLength;

            const end = {
                x: p.x + nx * side * L * .94 +
                   tx * L * .32,
                y: p.y + ny * side * L * .94 +
                   ty * L * .32
            };

            const c1 = {
                x: p.x + nx * side * L * .28 +
                   tx * L * .12,
                y: p.y + ny * side * L * .28 +
                   ty * L * .12
            };

            const c2 = {
                x: p.x + nx * side * L * .83 +
                   tx * L * .12 + wave,
                y: p.y + ny * side * L * .83 +
                   ty * L * .12
            };

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);

            ctx.bezierCurveTo(
                c1.x, c1.y,
                c2.x, c2.y,
                end.x, end.y
            );

            ctx.strokeStyle = "#77766d";
            ctx.lineWidth = 1.9 * unit;
            ctx.lineCap = "round";
            ctx.globalAlpha = .9;
            ctx.stroke();

            /* Fine inner line */
            ctx.beginPath();
            ctx.moveTo(
                p.x + nx * side * 3 * unit,
                p.y + ny * side * 3 * unit
            );

            ctx.bezierCurveTo(
                c1.x + nx * side * 3 * unit,
                c1.y + ny * side * 3 * unit,
                c2.x - nx * side * 4 * unit,
                c2.y - ny * side * 4 * unit,
                end.x - nx * side * 5 * unit,
                end.y - ny * side * 5 * unit
            );

            ctx.strokeStyle = "#b5b1a4";
            ctx.lineWidth = .8 * unit;
            ctx.globalAlpha = .75;
            ctx.stroke();

            ctx.restore();
        }
    }
}


/* ==========================================
   9. HEAD
========================================== */

function drawHead() {

    const p = body[0];
    const angle = Math.atan2(
        p.y - body[1].y,
        p.x - body[1].x
    );

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    /* Neck */
    ctx.beginPath();
    ctx.ellipse(
        -5 * unit, 0,
        18 * unit, 12 * unit,
        0, 0, Math.PI * 2
    );
    ctx.fillStyle = "#858379";
    ctx.fill();

    /* Head silhouette */
    ctx.beginPath();

    ctx.moveTo(13 * unit, -10 * unit);

    ctx.bezierCurveTo(
        4 * unit, -23 * unit,
        -17 * unit, -21 * unit,
        -29 * unit, -10 * unit
    );

    ctx.bezierCurveTo(
        -45 * unit, -2 * unit,
        -45 * unit, 13 * unit,
        -31 * unit, 20 * unit
    );

    ctx.bezierCurveTo(
        -17 * unit, 27 * unit,
        3 * unit, 16 * unit,
        13 * unit, 7 * unit
    );

    ctx.bezierCurveTo(
        20 * unit, 0,
        20 * unit, -5 * unit,
        13 * unit, -10 * unit
    );

    ctx.fillStyle = "#070807";
    ctx.fill();

    /* Mouth shape */
    ctx.beginPath();
    ctx.moveTo(-39 * unit, 7 * unit);

    ctx.quadraticCurveTo(
        -22 * unit, 19 * unit,
        -7 * unit, 8 * unit
    );

    ctx.quadraticCurveTo(
        -17 * unit, 28 * unit,
        -34 * unit, 18 * unit
    );

    ctx.fillStyle = "#e5e1d5";
    ctx.fill();

    /* Small eye */
    ctx.beginPath();
    ctx.arc(3 * unit, -10 * unit, 2 * unit, 0, Math.PI * 2);
    ctx.fillStyle = "#f2eee3";
    ctx.fill();

    ctx.restore();
}


/* ==========================================
   10. TAIL
========================================== */

function drawTail() {

    const p = body[SEGMENTS - 1];
    const previous = body[SEGMENTS - 2];

    const angle = Math.atan2(
        p.y - previous.y,
        p.x - previous.x
    );

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.moveTo(3 * unit, 0);
    ctx.quadraticCurveTo(
        -5 * unit, -5 * unit,
        -13 * unit, 0
    );
    ctx.quadraticCurveTo(
        -5 * unit, 5 * unit,
        3 * unit, 0
    );

    ctx.fillStyle = "#8d8a80";
    ctx.fill();

    ctx.restore();
}


/* ==========================================
   11. RENDER
========================================== */

function render(time) {

    ctx.clearRect(0, 0, W, H);

    drawSpines(time);
    drawBody();
    drawScales(time);
    drawTail();
    drawHead();
}


/* ==========================================
   12. MAIN LOOP
========================================== */

function frame(now) {

    let dt = (now - lastTime) / 1000;
    lastTime = now;

    dt = Math.min(dt, .033);

    updateHead(dt);
    updateBody(dt);
    render(now);

    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);


/* ==========================================
   13. MOBILE HAND TRACKING
========================================== */

let cameraInstance = null;
let handsInstance = null;

cameraButton.addEventListener("click", async () => {

    cameraButton.disabled = true;
    cameraButton.textContent = "STARTING CAMERA...";

    try {

        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("HTTPS camera access required");
        }

        if (!window.Hands || !window.Camera) {
            throw new Error("Tracking library unavailable");
        }

        handsInstance = new Hands({
            locateFile: file =>
                "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file
        });

        handsInstance.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: .7,
            minTrackingConfidence: .7
        });

        handsInstance.onResults(results => {

            const landmarks = results.multiHandLandmarks;

            if (landmarks && landmarks.length > 0) {

                const palm = landmarks[0][9];

                targetX = (1 - palm.x) * W;
                targetY = palm.y * H;

                statusText.textContent = "HAND TRACKING ACTIVE";

            } else {
                statusText.textContent = "SHOW YOUR HAND TO THE CAMERA";
            }
        });

        cameraInstance = new Camera(video, {
            onFrame: async () => {
                await handsInstance.send({image: video});
            },
            width: 640,
            height: 480
        });

        await cameraInstance.start();

        cameraButton.textContent = "HAND CONTROL ACTIVE";

    } catch (error) {

        console.error(error);

        statusText.textContent = "CAMERA ERROR";

        cameraButton.disabled = false;
        cameraButton.textContent = "TRY AGAIN";
    }
});


/* ==========================================
   14. INITIAL POSITION
========================================== */

headX = W * .5;
headY = H * .53;

targetX = headX;
targetY = headY;

initializeBody();

console.log("Living Reptile initialized.");
</script>

</body>
</html>
